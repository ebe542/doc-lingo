[project]
name = "doc-lingo"
version = "0.1.0"
description = "A Python CLI for translating documents while preserving formatting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "ebe542" }]
keywords = ["cli", "documents", "odp", "opendocument", "translation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "python-dotenv>=1,<2",
]

[project.urls]
Documentation = "https://github.com/ebe542/doc-lingo#readme"
Homepage = "https://github.com/ebe542/doc-lingo"
Issues = "https://github.com/ebe542/doc-lingo/issues"
Repository = "https://github.com/ebe542/doc-lingo"

[project.scripts]
doc-lingo = "doc_lingo.interfaces.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
local = [
  "sentencepiece>=0.2,<0.3",
  "sacremoses>=0.1,<0.2",
  "torch>=2.12,<2.14",
  "transformers>=5,<6",
]
release = [
  "build>=1,<2",
  "twine>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_lingo"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/pyproject.toml", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --import-mode=importlib"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Pytest base-temp directories may remain locked on Windows. They contain no
# source files and must not be traversed by formatting or lint checks.
extend-exclude = [".pytest-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
